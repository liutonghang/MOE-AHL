base:
  project_name: MOE_AHL
  ckpt_root: ./ckpt
  seed: 7
  lr: 0.0001
  weight_decay: 0.0001
  batch_size: 64
  n_epochs: 200
  num_workers: 8
  gpu_id: 1

dataset:
  datasetName: mosi
  dataPath: ./data/mosi/unaligned_50.pkl   # 528M
  train_mode: regression

model:
  bert_pretrained: bert-base-uncased

  # Projection Layer Parameters
  l_input_dim: 768
  a_input_dim: 5
  v_input_dim: 20
  l_proj_dst_dim: 128
  a_proj_dst_dim: 128
  v_proj_dst_dim: 128

  # Transformer Parameters token_dim 和 proj_depth已经确定
  token_len: 8
  token_dim: 128
  l_input_length: 50
  a_input_length: 375
  v_input_length: 500
  proj_input_dim: 128
  proj_depth: 2
  proj_heads: 8
  proj_mlp_dim: 128

  # Text Encoder Parameters
  token_length: 8
  l_enc_heads: 8
  l_enc_mlp_dim: 128

  # H Hyper Layer Parameters AHL_depth 已经确定
  AHL_depth: 5
  ahl_heads: 8
  ahl_dim_head: 16
  ahl_droup: 0.

  # Fusion Layer Parameters fusion_heads 和 fusion_layer_depth 已经确定
  fusion_heads: 8
  fusion_mlp_dim: 128
  fusion_layer_depth: 4

  # MoE Parameters
  moe_moisy_top1_router_experts: 3
  moe_number_expert: 4
  moe_cross_number_expert: 4